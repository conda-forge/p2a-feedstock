context:
  name: p2a
  version: "0.1.2"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/p/p2a/p2a-${{ version }}.tar.gz
  sha256: 86bead4ed95e52d0fc48dcb429e2a03f08013393226d641eb9580e77de24d00a

build:
  number: 0
  noarch: python
  script: python -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - hatchling
  run:
    - python >=${{ python_min }}
    - pkn >=0.3,<0.6

tests:
  - python:
      imports:
        - p2a
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  license: Apache-2.0
  license_file: LICENSE
  summary: pydantic models to argparse CLIs
  homepage: https://github.com/python-project-templates/p2a
  repository: https://github.com/python-project-templates/p2a

extra:
  recipe-maintainers:
    - timkpaine
